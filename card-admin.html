<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Cartas - Snap Deck Lab</title>
  <style>
    :root {
      --bg: #0b1018;
      --panel: #151b27;
      --panel-2: #1e2635;
      --line: #303b50;
      --text: #f4f7ff;
      --muted: #aab6ca;
      --yellow: #ffd247;
      --green: #57d68d;
      --red: #ff6473;
      --cyan: #59d7e8;
      --ink: #10131a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 16, 24, .94);
      backdrop-filter: blur(14px);
    }

    h1, h2 {
      margin: 0;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 { font-size: 24px; }
    h2 { font-size: 18px; }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-body {
      display: grid;
      gap: 12px;
      padding: 16px 18px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text);
      background: #0f1420;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(89, 215, 232, .16);
    }

    .btn {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--ink);
      background: var(--yellow);
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn.secondary {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .btn.good { background: var(--green); }
    .btn.danger { color: white; background: var(--red); }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .status {
      min-height: 40px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      background: #0f1420;
      font-weight: 700;
    }

    .status.good { color: #baffd3; border-color: rgba(87, 214, 141, .45); }
    .status.bad { color: #ffd0d5; border-color: rgba(255, 100, 115, .45); }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 12px;
      font-weight: 900;
    }

    .mini {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .token-preview {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--yellow);
      background: #0f1420;
      font-family: "Cascadia Code", Consolas, monospace;
      font-weight: 900;
      word-break: break-word;
    }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 240px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      text-transform: uppercase;
    }

    .card-name {
      font-weight: 900;
    }

    .card-id {
      color: var(--muted);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }

    .issues {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
    }

    .issue {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #0f1420;
      color: var(--muted);
      font-size: 13px;
    }

    .issue.bad { color: #ffd0d5; border-color: rgba(255, 100, 115, .45); }
    .issue.warn { color: #ffe7a1; border-color: rgba(255, 210, 71, .45); }

    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .split { grid-template-columns: 1fr; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Gerenciador de cartas</h1>
      <div class="mini">Este painel gera um cards.json limpo para a base global do Snap Deck Lab.</div>
    </div>
    <div class="button-row">
      <a class="btn secondary" href="index.html">Voltar ao gerador</a>
      <button class="btn secondary" type="button" id="btnLoadSite">Carregar cards.json</button>
      <button class="btn good" type="button" id="btnDownload">Baixar cards.json</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">
        <h2>Carta</h2>
        <span class="pill" id="modePill">Nova</span>
      </div>
      <div class="panel-body">
        <div class="status" id="status">Carregue a base atual ou importe um cards.json.</div>

        <div class="split">
          <div class="field">
            <label for="name">Nome</label>
            <input id="name" maxlength="64" placeholder="Ex: Monstro">
          </div>
          <div class="field">
            <label for="id">CardDefId</label>
            <input id="id" maxlength="48" placeholder="Ex: Monstro">
          </div>
        </div>

        <div class="split">
          <div class="field">
            <label for="cost">Custo</label>
            <input id="cost" type="number" min="0" max="9" value="3">
          </div>
          <div class="field">
            <label for="power">Poder</label>
            <input id="power" type="number" min="-30" max="30" value="0">
          </div>
        </div>

        <div class="split">
          <div class="field">
            <label for="series">Série</label>
            <select id="series">
              <option>S4/5</option>
              <option>S3</option>
              <option>S1/2</option>
              <option>Starter</option>
              <option>Unknown</option>
            </select>
          </div>
          <div class="field">
            <label>Token gerado</label>
            <div class="token-preview" id="tokenPreview">-</div>
          </div>
        </div>

        <div class="field">
          <label for="tags">Tags</label>
          <input id="tags" maxlength="160" placeholder="on-reveal, ramp, value">
        </div>

        <div class="field">
          <label for="codeToken">Token oficial sobrescrito</label>
          <input id="codeToken" maxlength="48" placeholder="Só use se o token do jogo for diferente do gerado">
        </div>

        <div class="field">
          <label for="imageUrl">URL da imagem</label>
          <input id="imageUrl" maxlength="900" placeholder="Snap.fan, MarvelSnapZone ou marvelsnap.pro">
        </div>

        <div class="button-row">
          <button class="btn good" type="button" id="btnSave">Adicionar / atualizar</button>
          <button class="btn secondary" type="button" id="btnClear">Limpar</button>
          <button class="btn danger" type="button" id="btnDelete">Excluir</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Base</h2>
        <span class="pill" id="countPill">0 cartas</span>
      </div>
      <div class="panel-body">
        <div class="button-row">
          <label class="btn secondary" for="fileInput">Importar JSON</label>
          <input id="fileInput" type="file" accept="application/json,.json" hidden>
          <button class="btn secondary" type="button" id="btnCopy">Copiar JSON</button>
          <button class="btn secondary" type="button" id="btnValidate">Validar</button>
        </div>
        <div class="field">
          <label for="search">Buscar</label>
          <input id="search" placeholder="Nome, ID ou tag">
        </div>
        <div class="issues" id="issues"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Carta</th>
              <th>Custo</th>
              <th>Poder</th>
              <th>Série</th>
              <th>Token</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const CARD_DATABASE_URL = "cards.json";
    const MAX_CARDS = 700;
    const MAX_DATA_URL_LENGTH = 900;
    const allowedSeries = ["Starter", "S1/2", "S3", "S4/5", "Custom", "Unknown"];
    let cards = [];
    let editingId = "";

    const el = {
      btnClear: document.getElementById("btnClear"),
      btnCopy: document.getElementById("btnCopy"),
      btnDelete: document.getElementById("btnDelete"),
      btnDownload: document.getElementById("btnDownload"),
      btnLoadSite: document.getElementById("btnLoadSite"),
      btnSave: document.getElementById("btnSave"),
      btnValidate: document.getElementById("btnValidate"),
      codeToken: document.getElementById("codeToken"),
      cost: document.getElementById("cost"),
      countPill: document.getElementById("countPill"),
      fileInput: document.getElementById("fileInput"),
      id: document.getElementById("id"),
      imageUrl: document.getElementById("imageUrl"),
      issues: document.getElementById("issues"),
      modePill: document.getElementById("modePill"),
      name: document.getElementById("name"),
      power: document.getElementById("power"),
      search: document.getElementById("search"),
      series: document.getElementById("series"),
      status: document.getElementById("status"),
      tableBody: document.getElementById("tableBody"),
      tags: document.getElementById("tags"),
      tokenPreview: document.getElementById("tokenPreview")
    };

    function cleanText(value, maxLength = 80) {
      return String(value ?? "")
        .replace(/[\u0000-\u001f\u007f]/g, "")
        .trim()
        .slice(0, maxLength);
    }

    function safeCardId(value) {
      return cleanText(value, 48).replace(/[^A-Za-z0-9]/g, "");
    }

    function safeCodeToken(value) {
      return cleanText(value, 48).replace(/[^A-Za-z0-9]/g, "");
    }

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.max(min, Math.min(max, Math.round(number)));
    }

    function plainText(value) {
      return cleanText(value, 120)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function safeImageUrl(value) {
      const url = cleanText(value, MAX_DATA_URL_LENGTH);
      if (!url) return "";
      if (url.startsWith("https://game-assets.snap.fan/")) return url;
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.toLowerCase();
        const allowedHost =
          host === "snap.fan" ||
          host.endsWith(".snap.fan") ||
          host === "marvelsnapzone.com" ||
          host.endsWith(".marvelsnapzone.com") ||
          host === "marvelsnap.pro" ||
          host.endsWith(".marvelsnap.pro");
        if (parsed.protocol === "https:" && allowedHost && !/[")\\]/.test(url)) return parsed.href;
      } catch (error) {
        return "";
      }
      return "";
    }

    function compactCardBase(id) {
      const safeId = safeCardId(id);
      return safeId.slice(0, 1) + safeId.slice(1).replace(/[aeiouy]/ig, "");
    }

    function legacyCompactCardBase(id) {
      const safeId = safeCardId(id);
      return safeId.slice(0, 1) + safeId.slice(1).replace(/[aeiou]/ig, "");
    }

    function compactCardToken(id) {
      const safeId = safeCardId(id);
      return safeId ? `${compactCardBase(safeId)}${safeId.length.toString(36).toUpperCase()}` : "";
    }

    function legacyCompactCardToken(id) {
      const safeId = safeCardId(id);
      return safeId ? `${legacyCompactCardBase(safeId)}${safeId.length.toString(36).toUpperCase()}` : "";
    }

    function officialCardToken(card) {
      const generated = compactCardToken(card && card.id);
      const override = safeCodeToken(card && card.codeToken);
      return override || generated;
    }

    function normalizeCard(card) {
      const id = safeCardId(card && card.id);
      const name = cleanText(card && card.name, 64) || id || "Carta";
      const rawSeries = cleanText(card && card.series, 20);
      const tags = Array.isArray(card && card.tags)
        ? card.tags
        : String(card && card.tags || "").split(",");
      const imageUrl = safeImageUrl(card && card.imageUrl);
      const codeToken = safeCodeToken(card && card.codeToken);
      const output = {
        name,
        id,
        cost: clampNumber(card && card.cost, 0, 9, 3),
        power: clampNumber(card && card.power, -30, 30, 0),
        series: allowedSeries.includes(rawSeries) ? rawSeries : "Unknown",
        tags: [...new Set(tags.map(tag => cleanText(tag, 24).toLowerCase()).filter(Boolean))].slice(0, 8)
      };
      if (codeToken && codeToken !== compactCardToken(id)) output.codeToken = codeToken;
      if (imageUrl) output.imageUrl = imageUrl;
      return output;
    }

    function setStatus(message, kind = "") {
      el.status.textContent = message;
      el.status.className = `status ${kind}`.trim();
    }

    function sortCards() {
      cards.sort((a, b) => (a.cost - b.cost) || a.name.localeCompare(b.name, "pt-BR"));
    }

    function buildPayload() {
      sortCards();
      return {
        schema: 1,
        updatedAt: new Date().toISOString().slice(0, 10),
        source: "Snap Deck Lab cards.json",
        cards: cards.map(normalizeCard)
      };
    }

    function renderIssues(messages) {
      el.issues.innerHTML = "";
      messages.slice(0, 80).forEach(message => {
        const item = document.createElement("div");
        item.className = `issue ${message.kind}`;
        item.textContent = message.text;
        el.issues.appendChild(item);
      });
      if (!messages.length) {
        const ok = document.createElement("div");
        ok.className = "issue";
        ok.textContent = "Nenhum problema encontrado.";
        el.issues.appendChild(ok);
      }
    }

    function validateCards() {
      const messages = [];
      const ids = new Map();
      const tokens = new Map();
      cards.forEach(card => {
        if (!card.id || !card.name) messages.push({ kind: "bad", text: `${card.name || "Carta sem nome"} está sem nome ou CardDefId.` });
        if (card.id && !/^[A-Za-z0-9]+$/.test(card.id)) messages.push({ kind: "bad", text: `${card.name}: CardDefId deve ter só letras e números.` });
        if (ids.has(card.id)) messages.push({ kind: "bad", text: `CardDefId duplicado: ${card.id} (${ids.get(card.id)} / ${card.name}).` });
        ids.set(card.id, card.name);

        const token = officialCardToken(card);
        if (tokens.has(token)) messages.push({ kind: "bad", text: `Token duplicado: ${token} (${tokens.get(token)} / ${card.name}).` });
        tokens.set(token, card.name);

        const legacy = legacyCompactCardToken(card.id);
        const generated = compactCardToken(card.id);
        if (card.codeToken && card.codeToken === legacy && legacy !== generated) {
          messages.push({ kind: "warn", text: `${card.name}: token parece legado; o gerado atual é ${generated}.` });
        }
        if (!safeImageUrl(card.imageUrl)) messages.push({ kind: "warn", text: `${card.name}: sem imagem ou URL fora das fontes aceitas.` });
      });
      renderIssues(messages);
      setStatus(messages.some(item => item.kind === "bad") ? "Base com erros bloqueantes." : `Base válida com ${cards.length} cartas.`, messages.some(item => item.kind === "bad") ? "bad" : "good");
      return !messages.some(item => item.kind === "bad");
    }

    function renderTable() {
      const query = plainText(el.search.value);
      const filtered = cards.filter(card => {
        const haystack = plainText(`${card.name} ${card.id} ${card.series} ${card.tags.join(" ")}`);
        return !query || haystack.includes(query);
      });
      el.tableBody.innerHTML = "";
      filtered.forEach(card => {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        const name = document.createElement("div");
        name.className = "card-name";
        name.textContent = card.name;
        const id = document.createElement("div");
        id.className = "card-id";
        id.textContent = card.id;
        nameCell.append(name, id);

        const cost = document.createElement("td");
        cost.textContent = card.cost;
        const power = document.createElement("td");
        power.textContent = card.power;
        const series = document.createElement("td");
        series.textContent = card.series;
        const token = document.createElement("td");
        token.className = "card-id";
        token.textContent = officialCardToken(card);
        const actions = document.createElement("td");
        const edit = document.createElement("button");
        edit.className = "btn secondary";
        edit.type = "button";
        edit.textContent = "Editar";
        edit.addEventListener("click", () => editCard(card.id));
        actions.appendChild(edit);
        row.append(nameCell, cost, power, series, token, actions);
        el.tableBody.appendChild(row);
      });
      el.countPill.textContent = `${cards.length} cartas`;
    }

    function clearForm() {
      editingId = "";
      el.modePill.textContent = "Nova";
      el.name.value = "";
      el.id.value = "";
      el.cost.value = "3";
      el.power.value = "0";
      el.series.value = "S4/5";
      el.tags.value = "";
      el.codeToken.value = "";
      el.imageUrl.value = "";
      updateTokenPreview();
    }

    function editCard(id) {
      const card = cards.find(item => item.id === id);
      if (!card) return;
      editingId = card.id;
      el.modePill.textContent = "Editando";
      el.name.value = card.name;
      el.id.value = card.id;
      el.cost.value = String(card.cost);
      el.power.value = String(card.power);
      el.series.value = card.series;
      el.tags.value = card.tags.join(", ");
      el.codeToken.value = card.codeToken || "";
      el.imageUrl.value = card.imageUrl || "";
      updateTokenPreview();
      setStatus(`${card.name} carregada para edição.`, "");
    }

    function cardFromForm() {
      const rawId = cleanText(el.id.value, 48);
      const id = safeCardId(rawId);
      const card = normalizeCard({
        name: el.name.value,
        id,
        cost: el.cost.value,
        power: el.power.value,
        series: el.series.value,
        tags: el.tags.value,
        codeToken: el.codeToken.value,
        imageUrl: el.imageUrl.value
      });
      if (!card.name || !card.id) throw new Error("Preencha nome e CardDefId.");
      if (rawId !== id) throw new Error("CardDefId deve usar só letras e números.");
      if (el.imageUrl.value.trim() && !safeImageUrl(el.imageUrl.value)) throw new Error("URL de imagem fora das fontes aceitas.");
      return card;
    }

    function saveCard() {
      let card;
      try {
        card = cardFromForm();
      } catch (error) {
        setStatus(error.message, "bad");
        return;
      }
      const duplicatedId = cards.find(item => item.id === card.id && item.id !== editingId);
      if (duplicatedId) {
        setStatus(`CardDefId ${card.id} já existe em ${duplicatedId.name}.`, "bad");
        return;
      }
      cards = cards.filter(item => item.id !== editingId && item.id !== card.id);
      cards.push(card);
      sortCards();
      renderTable();
      validateCards();
      editCard(card.id);
      setStatus(`${card.name} salva no cards.json em edição.`, "good");
    }

    function deleteCard() {
      if (!editingId) {
        setStatus("Nenhuma carta selecionada para excluir.", "bad");
        return;
      }
      const removed = cards.find(card => card.id === editingId);
      cards = cards.filter(card => card.id !== editingId);
      clearForm();
      renderTable();
      validateCards();
      setStatus(`${removed ? removed.name : "Carta"} excluída do cards.json em edição.`, "good");
    }

    function updateTokenPreview() {
      el.tokenPreview.textContent = compactCardToken(el.id.value) || "-";
    }

    function loadCardsFromPayload(payload) {
      const rawCards = Array.isArray(payload) ? payload : payload && payload.cards;
      if (!Array.isArray(rawCards)) throw new Error("JSON sem array de cartas.");
      const map = new Map();
      rawCards.slice(0, MAX_CARDS).forEach(rawCard => {
        const card = normalizeCard(rawCard);
        if (card.id && card.name) map.set(card.id, card);
      });
      cards = [...map.values()];
      sortCards();
      clearForm();
      renderTable();
      validateCards();
    }

    async function loadSiteCards() {
      try {
        const response = await fetch(`${CARD_DATABASE_URL}?t=${Date.now()}`, { cache: "reload" });
        if (!response.ok) throw new Error("cards.json indisponível.");
        loadCardsFromPayload(await response.json());
        setStatus(`cards.json carregado com ${cards.length} cartas.`, "good");
      } catch (error) {
        setStatus("Não consegui carregar cards.json. Importe o arquivo manualmente.", "bad");
      }
    }

    async function importFile(file) {
      if (!file || file.size > 2_000_000) {
        setStatus("Arquivo inválido ou grande demais.", "bad");
        return;
      }
      try {
        loadCardsFromPayload(JSON.parse(await file.text()));
        setStatus(`Arquivo importado com ${cards.length} cartas.`, "good");
      } catch (error) {
        setStatus(`JSON inválido: ${error.message}`, "bad");
      } finally {
        el.fileInput.value = "";
      }
    }

    function jsonText() {
      return JSON.stringify(buildPayload(), null, 2) + "\n";
    }

    function downloadJson() {
      if (!validateCards()) return;
      const blob = new Blob([jsonText()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "cards.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus("cards.json baixado.", "good");
    }

    async function copyJson() {
      if (!validateCards()) return;
      try {
        await navigator.clipboard.writeText(jsonText());
        setStatus("cards.json copiado.", "good");
      } catch (error) {
        setStatus("Não consegui copiar automaticamente.", "bad");
      }
    }

    el.btnClear.addEventListener("click", clearForm);
    el.btnCopy.addEventListener("click", copyJson);
    el.btnDelete.addEventListener("click", deleteCard);
    el.btnDownload.addEventListener("click", downloadJson);
    el.btnLoadSite.addEventListener("click", loadSiteCards);
    el.btnSave.addEventListener("click", saveCard);
    el.btnValidate.addEventListener("click", validateCards);
    el.fileInput.addEventListener("change", event => importFile(event.target.files[0]));
    el.id.addEventListener("input", updateTokenPreview);
    el.search.addEventListener("input", renderTable);

    clearForm();
    loadSiteCards();
  </script>
</body>
</html>
